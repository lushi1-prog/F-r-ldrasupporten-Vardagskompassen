<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vardagskompassen – fixad version</title>
<style>
:root{--ink:#193d38;--brand:#3f8f7d;--soft:#e9f4f0;--bg:#f6f8f7;--line:#d9e5e1;--muted:#637773;--white:#fff;--shadow:0 8px 25px rgba(25,61,56,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55;overflow-x:hidden;overflow-y:auto}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(1100px,100%);margin:auto;padding:12px 16px 70px}header{display:flex;align-items:center;gap:12px;padding:8px 0 12px}.logo{width:48px;height:48px;border-radius:16px;background:#dceee8;display:grid;place-items:center;font-size:26px}.brand{font-weight:800;font-size:25px}.tag{font-size:13px;color:var(--muted)}nav{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 0 14px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}nav button{border:0;background:#e8efec;color:var(--ink);border-radius:14px;padding:11px 15px;font-weight:800;white-space:nowrap;flex:0 0 auto}nav button.active{background:var(--brand);color:#fff}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#eaf6f1,#dceee8);border-radius:26px;padding:24px;margin:6px 0 18px}.small{font-size:13px;font-weight:800;color:#3d6d64}.hero h1{font-size:34px;line-height:1.12;margin:6px 0 10px}.hero p{font-size:17px;margin:0;color:#31534e}.plate-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.plate-layout{display:grid;grid-template-columns:minmax(300px,500px) minmax(280px,1fr);gap:22px;align-items:center}.plate-wrap{width:min(100%,500px);margin:auto;aspect-ratio:1}.plate{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;border:9px solid #dcebe5;box-shadow:inset 0 0 0 2px #fff,0 10px 28px rgba(25,61,56,.12)}.sector{position:absolute;left:5%;top:5%;width:90%;height:90%;border:2px solid rgba(255,255,255,.8);padding:0;background:var(--c);clip-path:polygon(50% 50%,0 0,100% 0);transform:rotate(var(--r));transition:filter .15s,transform .15s}.sector:hover{filter:brightness(.97)}.sector span{position:absolute;left:50%;top:14%;width:145px;transform:translateX(-50%) rotate(calc(-1 * var(--r)));text-align:center;font-weight:800;font-size:15px;line-height:1.15}.center{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:31%;aspect-ratio:1;border-radius:50%;background:#fff;border:5px solid #dcebe5;display:grid;place-items:center;text-align:center;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.08)}.center b{font-size:14px;line-height:1.15}.center small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.detail{background:linear-gradient(145deg,#f0f5f2,#e7efeb);border-radius:25px;padding:22px;min-height:330px}.detail .icon{font-size:31px}.detail h2{font-size:29px;line-height:1.15;margin:5px 0 10px}.detail p{font-size:17px;margin:0 0 12px}.try{background:#f1dfb1;border-radius:16px;padding:14px;font-size:16px}.try b{display:block;margin-bottom:3px}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.counter{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.counter span{display:block;color:var(--muted);font-size:12px}.counter b{font-size:26px}.cards,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;box-shadow:0 4px 14px rgba(25,61,56,.04)}.card h3{margin:5px 0;font-size:20px}.card p{color:var(--muted);margin:5px 0 13px}.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;min-height:135px;color:var(--ink)}.tile strong{display:block;font-size:18px;margin:6px 0}.tile small{display:block;color:var(--muted);line-height:1.45}.chip{display:inline-block;background:#edf3f0;border-radius:999px;padding:5px 9px;font-size:12px;margin-top:9px}.btn{border:0;background:var(--brand);color:#fff;border-radius:14px;padding:11px 15px;font-weight:800;min-height:45px}.btn.secondary{background:#e8efec;color:var(--ink)}.btn.full{width:100%}.action{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.back{border:0;background:transparent;color:var(--brand);font-weight:800;padding:5px 0;margin-bottom:8px}.detailbox{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.steps{display:grid;gap:9px;margin:16px 0}.step{display:flex;gap:11px;background:#f3f8f6;border-radius:17px;padding:14px}.num{flex:0 0 31px;height:31px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}.example{background:#edf6f2;border-left:5px solid var(--brand);padding:15px;border-radius:0 16px 16px 0}.list{display:grid;gap:10px}.input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:5px}
.chat{background:#fff;border:1px solid var(--line);border-radius:25px;overflow:hidden;box-shadow:var(--shadow)}.chat-head{background:#e8f3ef;padding:18px}.chat-head h2{margin:0;font-size:23px}.chat-head p{margin:3px 0 0;color:var(--muted)}.messages{padding:16px;min-height:320px;max-height:520px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;background:#f8faf9}.msg{max-width:86%;padding:12px 14px;border-radius:17px;white-space:pre-wrap}.bot{align-self:flex-start;background:#e7f1ee}.user{align-self:flex-end;background:var(--brand);color:#fff}.quick{display:flex;gap:7px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line)}.quick button{border:0;background:#edf3f1;border-radius:13px;padding:9px 11px;color:var(--ink)}.chat-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid var(--line)}.chat-row input{min-width:0}.progress{height:8px;background:#e1ebe7;border-radius:99px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:var(--brand);width:20%}.flowbox,.why{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:10px}.flowbox{background:var(--soft)}footer{margin-top:35px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media(max-width:800px){.app{padding:10px 11px 55px}.brand{font-size:22px}.hero{padding:20px 17px}.hero h1{font-size:29px}.plate-layout{grid-template-columns:1fr}.plate-wrap{width:min(88vw,430px)}.detail{min-height:0}.cards,.grid{grid-template-columns:1fr}.counters{grid-template-columns:1fr 1fr}.chat-row{grid-template-columns:1fr}.chat-row .btn{width:100%}.action{display:grid;grid-template-columns:1fr}.action .btn{width:100%}}
@media(max-width:460px){.app{padding-left:9px;padding-right:9px}.plate-wrap{width:94vw}.sector span{width:100px;font-size:11px;top:15%}.center{width:34%}.center b{font-size:10px}.center small{font-size:8px}.detail h2{font-size:25px}.detail p{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🧭</div><div><div class="brand">Vardagskompassen</div><div class="tag">En enkel hjälp i vardagen för föräldrar</div></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<footer><b>Vardagskompassen</b><br>Ett pedagogiskt vardagsstöd för föräldrar.</footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const areas={
 love:{icon:'❤️',title:'Kärlek',short:'Visa barnet att det är älskat och viktigt.',text:'Barn behöver känna att de är älskade och viktiga – också när vardagen är stressig och barnet gör fel. Du kan sätta gränser och samtidigt visa värme.',try:'Gör en liten sak idag som visar barnet: Du är viktig för mig.'},
 presence:{icon:'👀',title:'Närvaro',short:'Var tillsammans och försök vara närvarande i stunden.',text:'Närvaro handlar inte om att du måste ha mycket tid. En kort stund med riktig uppmärksamhet kan betyda mycket. Lyssna när barnet berättar och försök vara nära i stunden.',try:'Lägg undan mobilen en kort stund och lyssna på barnet utan att försöka lösa allt.'},
 confirm:{icon:'💬',title:'Bekräftelse',short:'Lyssna och visa att barnets känslor får finnas.',text:'Att bekräfta betyder inte att du måste hålla med om allt. Du visar att du ser och hör barnet och försöker förstå känslan.',try:'Säg: ”Jag förstår att det här blev jobbigt för dig” innan du ger råd.'},
 self:{icon:'🌱',title:'Självkänsla & medkänsla',short:'Hjälp barnet känna att det duger.',text:'Självkänsla handlar om att känna ”Jag duger”. Medkänsla handlar bland annat om att kunna vara snäll mot sig själv när något blir fel. Se också barnets försök, mod och omtanke – inte bara resultat.',try:'Uppmärksamma ett försök eller en omtanke idag, inte bara ett resultat.'},
 rest:{icon:'🌿',title:'Återhämtning',short:'Ge plats för sömn, vila, lek och pauser.',text:'Barn behöver tid att vila, leka och bara vara. Det behöver du som förälder också. När man är trött och stressad blir det lättare att tappa tålamodet.',try:'Hitta en liten stund idag för vila eller lugn och ta bort ett onödigt krav.'},
 frames:{icon:'🧭',title:'Ramar',short:'Tydliga gränser hjälper barnet att veta vad som gäller.',text:'Barn behöver vuxna som visar vägen. Välj det som verkligen är viktigt och håll fast vid det på ett lugnt sätt. Du kan vara varm och samtidigt sätta en tydlig gräns.',try:'Bestäm en kort mening du kan använda nästa gång en gräns behöver sättas.'}
};
const situations=[
['😤','Mitt barn får ett utbrott','När känslorna blir stora och det är svårt att nå fram.'],['📱','Vi bråkar om mobilen/skärmen','När skärmen blir en återkommande konflikt.'],['🛏️','Läggningen fungerar inte','När kvällarna blir långa, stressiga eller konfliktfyllda.'],['🏫','Mitt barn vill inte gå till skolan','När skolan väcker motstånd, oro eller konflikter.'],['💬','Mitt barn vill inte prata','När barnet drar sig undan eller stänger av.'],['😟','Mitt barn verkar ledset','När du märker förändringar i humör eller beteende.'],['🥊','Barnen slåss eller bråkar','När syskon eller andra barn hamnar i fysiska bråk.'],['💊','Jag är orolig för droger','När du misstänker alkohol eller droger eller har hittat något som gör dig orolig.'],['🏠','Vanliga vardagsbråk','När vardagen fastnar i tjat, stress eller små konflikter.'],['🤥','När barnet ljuger','När du misstänker att barnet inte berättar hela sanningen.'],['👨‍👩‍👧','Olika regler mellan föräldrar','När vuxna har olika regler eller sätt att göra saker.'],['👨‍👩‍👧','Bonusfamilj','När familjen förändras genom en ny partner eller nya familjemedlemmar.'],['🍼','Nytt syskon','När ett nytt barn kommer och det äldre barnet reagerar.'],['🗣️','Svordomar och respektlöst språk','När språket blir hårt och du vill sätta gränser utan att fastna i bråk.'],['🔒','Gränser och säkerhet på nätet','När du oroar dig för kontakter, bilder eller hemligheter på nätet.'],['🍺','Alkohol','När du är orolig för barnets eller ungdomens alkoholvanor.'],['🚬','Vape, snus och nikotin','När du upptäcker eller misstänker nikotinanvändning.'],['🔥','Jag håller på att tappa tålamodet','När du själv blir överbelastad som förälder.'],['👥','Mitt barn har problem med kompisar','När relationer, konflikter eller utanförskap blir svårt.']
];
const bank=[
[/utbrott|arg|raseri|skriker|slår/,'När känslorna är stora: försök först att sänka tempot. Bekräfta känslan och håll en viktig gräns lugnt. När barnet har lugnat sig kan ni prata om vad som hände.'],
[/mobil|skärm|telefon/,'Försök göra reglerna tydliga i förväg och undvik långa diskussioner precis när skärmen ska stängas. Du kan säga: ”Jag vet att du vill fortsätta. Det är svårt att sluta när man har roligt. Nu är tiden slut.”'],
[/skola|skolvägr|ont i magen/,'Försök förstå vad som gör skolan svår innan fokus bara blir på frånvaron. Prata med barnet och ta vid behov kontakt med skolan eller elevhälsan.'],
[/prata|berätta|stäng av/,'Pressa inte barnet att berätta allt på en gång. Du kan säga: ”Du behöver inte berätta allt nu. Jag finns här när du vill prata.”'],
[/slåss|syskon|bråkar/,'Börja med tryggheten. Stoppa det fysiska bråket lugnt och separera om det behövs. När alla lugnat sig kan du försöka förstå vad som hände.'],
[/drog|cannabis|narkot|vape|snus|alkohol/,'Försök prata när situationen är lugn. Börja med din oro snarare än anklagelser. Vid tydlig oro eller risk kan professionellt stöd behövas.'],
[/läxa|mat|måltid|klä på|vardag/,'Titta på vad som händer precis innan konflikten. Kan kravet bli tydligare, mindre eller komma vid en bättre tidpunkt?'],
[/ledsen|orolig|drar sig undan/,'Lägg märke till förändringar över tid. Försök vara nära utan att pressa. Om barnet mår tydligt sämre kan professionellt stöd behövas.'],
[/ljuger|lögn/,'Försök förstå vad barnet försöker skydda sig från innan samtalet blir ett förhör. Var tydlig med att sanningen är viktig och visa samtidigt att barnet kan komma till dig.'],
[/tålamod|skriker|helt slut/,'Om du känner att du håller på att tappa kontrollen: skapa avstånd om det går och försök få ner stressen först. Barnets och din säkerhet kommer först.']
];
let selected='presence';
function storage(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function put(k,v){localStorage.setItem(k,JSON.stringify(v));updateCounts()}
function page(name){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(name).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));window.scrollTo(0,0)}
function nav(){const items=[['home','Hem'],['areas','Områden'],['situations','Situationer'],['chat','💬 Fråga Vardagskompassen'],['children','Barn'],['history','Historik'],['patterns','Mönster'],['follow','Uppföljning'],['reminders','Påminnelser'],['support','❤️ Stöd'],['words','💬 Säg så här']];$('nav').innerHTML=items.map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>page(b.dataset.page))}
function plate(){return `<div class="plate-wrap"><div class="plate">
<button class="sector" style="--r:0deg;--c:#e9b9b5" onclick="selectArea('love')"><span>❤️<br>Kärlek</span></button>
<button class="sector" style="--r:60deg;--c:#c7e0dd" onclick="selectArea('presence')"><span>👀<br>Närvaro</span></button>
<button class="sector" style="--r:120deg;--c:#ead9a9" onclick="selectArea('confirm')"><span>💬<br>Bekräftelse</span></button>
<button class="sector" style="--r:180deg;--c:#cbdcaf" onclick="selectArea('self')"><span>🌱<br>Självkänsla<br>& medkänsla</span></button>
<button class="sector" style="--r:240deg;--c:#cfc6df" onclick="selectArea('rest')"><span>🌿<br>Återhämtning</span></button>
<button class="sector" style="--r:300deg;--c:#e6c4b6" onclick="selectArea('frames')"><span>🧭<br>Ramar</span></button>
<div class="center"><div><b>VARDAGS-<br>KOMPASSEN</b><small>Tryck på en del</small></div></div></div></div>`}
function detail(){const a=areas[selected];$('detail').innerHTML=`<div class="detail"><div class="icon">${a.icon}</div><h2>${a.title}</h2><p>${a.text}</p><div class="try"><b>Prova idag</b>${a.try}</div></div>`}
function selectArea(k){selected=k;detail();document.querySelector('.detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function home(){return `<section id="home" class="page active"><div class="hero"><div class="small">Din digitala kompass</div><h1>Sex delar som hjälper barnet att må bra</h1><p>Ingen familj behöver få allt rätt hela tiden. Tallriken hjälper dig att se vilka delar som finns i vardagen och vilken del du kanske vill ge lite extra plats just nu.</p></div><div class="plate-card"><div class="plate-layout">${plate()}<div id="detail"></div></div></div><div class="counters"><div class="counter"><span>Sparade</span><b id="saved">0</b></div><div class="counter"><span>Följa upp</span><b id="followCount">0</b></div><div class="counter"><span>Anteckningar</span><b id="notes">0</b></div><div class="counter"><span>Påminnelser</span><b id="reminderCount">0</b></div></div><h2>Välj en situation</h2><p>Vanliga vardagssituationer – med fem enkla steg.</p><div id="homeSituations" class="grid"></div></section>`}
function areasPage(){return `<section id="areas" class="page"><div class="hero"><div class="small">Vardagens olika delar</div><h1>Sex delar som hjälper barnet att må bra</h1><p>Tryck på en del för att läsa mer.</p></div><div class="grid">${Object.entries(areas).map(([k,a])=>`<button class="tile" onclick="showArea('${k}')"><span style="font-size:28px">${a.icon}</span><strong>${a.title}</strong><small>${a.short}</small></button>`).join('')}</div></section>`}
function showArea(k){selected=k;const a=areas[k];$('detailPage').innerHTML=`<button class="back" onclick="page('areas')">← Tillbaka</button><div class="detailbox"><div class="icon" style="font-size:32px">${a.icon}</div><h2>${a.title}</h2><p>${a.text}</p><div class="try"><b>Prova idag</b>${a.try}</div></div>`;page('detailPage')}
function situationsPage(){return `<section id="situations" class="page"><div class="hero"><div class="small">Situationer</div><h1>Välj det som känns mest likt</h1><p>Varje situation får fem enkla steg.</p></div><div id="allSituations" class="grid"></div></section>`}
function renderSituations(target){$(target).innerHTML=situations.map((s,i)=>`<button class="tile" onclick="openSituation(${i})"><span style="font-size:28px">${s[0]}</span><strong>${s[1]}</strong><small>${s[2]}</small><span class="chip">5 steg</span></button>`).join('')}
function openSituation(i){const s=situations[i];let step=0;$('situationPage').innerHTML=`<button class="back" onclick="page('situations')">← Alla situationer</button><div class="hero"><div class="small">${s[0]} Situation</div><h1>${s[1]}</h1><p>${s[2]}</p></div><div class="detailbox"><div class="progress"><i id="spbar"></i></div><b id="spno">Steg 1 av 5</b><h2 id="sptitle">Stanna upp</h2><p id="sptext">Vad händer precis innan situationen blir svår? Vad gör barnet och vad gör du?</p><div class="why"><b>💡 Varför?</b><p id="spwhy">När du först förstår vad som händer blir det lättare att välja nästa steg.</p></div><div id="spSave"></div><div class="action"><button class="btn secondary" onclick="prevS()">← Föregående</button><button class="btn" id="spnext" onclick="nextS()">Nästa steg →</button></div></div></div></div>`;page('situationPage');window._step=step;window._sit=i;renderS()}
const steps=[['Stanna upp','Vad händer precis innan situationen blir svår? Vad gör barnet och vad gör du?','När du först förstår vad som händer blir det lättare att välja nästa steg.'],['Sänk tempot','Gör situationen lite lugnare. När känslorna är starka är det svårt att lösa problemet.','När tempot sjunker blir det ofta lättare att lyssna och tänka.'],['Välj ett sätt','Välj några enkla ord eller en liten handling som kan hjälpa.','En enkel sak är lättare att prova än att försöka lösa allt.'],['Tänk efter','Vad fungerade? Vad vill du göra lite annorlunda nästa gång?','Små förändringar som går att upprepa är ofta lättare att få in i vardagen.'],['Spara','Skriv kort vad du vill prova nästa gång.','När du sparar kan du komma tillbaka och se vad du provade.']];
function renderS(){const n=window._step;$('spno').textContent=`Steg ${n+1} av 5`;$('sptitle').textContent=steps[n][0];$('sptext').textContent=steps[n][1];$('spwhy').textContent=steps[n][2];$('spbar').style.width=((n+1)*20)+'%';$('spnext').textContent=n===4?'💾 Spara och följ upp':'Nästa steg →';$('spSave').innerHTML=n===4?`<textarea id="plan" placeholder="Skriv kort vad du vill prova nästa gång"></textarea>`:''}
function nextS(){if(window._step<4){window._step++;renderS();return}const plan=$('plan')?.value||'Ett litet steg att prova nästa gång.';const h=storage('vc_history',[]);h.unshift({title:situations[window._sit][1],text:plan,date:new Date().toLocaleString('sv-SE')});put('vc_history',h.slice(0,100));const f=storage('vc_follow',[]);f.unshift({title:situations[window._sit][1],text:plan,date:new Date().toLocaleDateString('sv-SE')});put('vc_follow',f.slice(0,50));page('follow')}
function prevS(){if(window._step>0){window._step--;renderS()}else page('situations')}
function chatPage(){return `<section id="chat" class="page"><div class="hero"><div class="small">Din digitala kompass 💬</div><h1>Fråga Vardagskompassen</h1><p>Berätta med dina egna ord. Du behöver inte skriva på något särskilt sätt.</p></div><div class="chat"><div class="chat-head"><h2>Vardagskompassen</h2><p>Jag dömer inte. Vi tar en sak i taget.</p></div><div id="messages" class="messages"><div class="msg bot">Hej! 👋 Vad händer hemma just nu? Skriv precis som du skulle berätta för en annan person.</div></div><div class="quick"><button onclick="quick('Mitt barn får ett utbrott')">Utbrott</button><button onclick="quick('Vi bråkar om mobilen')">Mobil/skärm</button><button onclick="quick('Mitt barn vill inte gå till skolan')">Skolan</button><button onclick="quick('Mitt barn vill inte prata')">Prata</button><button onclick="quick('Mina barn slåss')">Syskonbråk</button><button onclick="quick('Jag är orolig för droger')">Droger</button></div><div class="chat-row"><input id="chatInput" type="text" placeholder="Skriv din fråga här..." autocomplete="off"><button class="btn" onclick="sendChat()">Skicka</button></div></div></section>`}
function sendChat(){const el=$('chatInput');const t=el.value.trim();if(!t)return;addMsg(t,'user');el.value='';setTimeout(()=>addMsg(answer(t),'bot'),180)}
function quick(t){$('chatInput').value=t;sendChat()}
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function answer(q){q=q.toLowerCase();for(const [re,a] of bank)if(re.test(q))return a;return 'Börja med att stanna upp och beskriva vad som händer just nu. Vad gör barnet, vad gör du och vad hände precis innan? Välj sedan ett litet steg som känns möjligt att prova. Du behöver inte lösa allt på en gång.'}
function simplePage(id,title,text,body){return `<section id="${id}" class="page"><div class="hero"><div class="small">Vardagskompassen</div><h1>${title}</h1><p>${text}</p></div>${body}</section>`}
function historyPage(){const h=storage('vc_history',[]);return simplePage('history','Historik','Här hittar du sådant du har sparat i den här webbläsaren.',`<div id="historyList" class="list">${h.length?h.map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.text)}</p><small>${esc(x.date)}</small></div>`).join(''):'<div class="card">Du har inte sparat något ännu.</div>'}</div>`)}
function followPage(){const f=storage('vc_follow',[]);return simplePage('follow','Uppföljning','Se vad du provade och vad du vill göra nästa gång.',`<div class="list">${f.length?f.map((x,i)=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.text)}</p><small>${esc(x.date)}</small><div class="action"><button class="btn secondary" onclick="removeFollow(${i})">Ta bort</button></div></div>`).join(''):'<div class="card">Inget att följa upp ännu.</div>'}</div>`)}
function removeFollow(i){const f=storage('vc_follow',[]);f.splice(i,1);put('vc_follow',f);render()}
function childrenPage(){const c=storage('vc_children',[]);return simplePage('children','Barn','Lägg till barn om du vill spara en enkel anteckning.',`<div class="card"><div class="field"><label>Namn</label><input id="cn" placeholder="Barnets namn"></div><div class="field"><label>Ålder</label><input id="ca" placeholder="Ålder"></div><div class="field"><label>Anteckning</label><textarea id="cm" placeholder="Något du vill komma ihåg"></textarea></div><button class="btn" onclick="addChild()">Lägg till barn</button></div><div class="list" style="margin-top:12px">${c.length?c.map(x=>`<div class="card"><b>👤 ${esc(x.name)}</b>${x.age?` · ${esc(x.age)} år`:''}<p>${esc(x.note||'')}</p></div>`).join(''):'<div class="card">Inga barn sparade ännu.</div>'}</div>`)}
function addChild(){const n=$('cn').value.trim();if(!n){alert('Skriv ett namn.');return}const c=storage('vc_children',[]);c.push({name:n,age:$('ca').value,note:$('cm').value});put('vc_children',c);render()}
function patternsPage(){const h=storage('vc_history',[]),m={};h.forEach(x=>m[x.title]=(m[x.title]||0)+1);return simplePage('patterns','Mönster','Se vilka situationer som återkommer i det du sparat.',`<div class="list">${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="card"><b>${esc(x[0])}</b><p>${x[1]} sparad${x[1]===1?'':'e'} situation${x[1]===1?'':'er'}.</p></div>`).join('')||'<div class="card">Spara några situationer så visas mönster.</div>'}</div>`)}
function remindersPage(){const r=storage('vc_reminders',[]);return simplePage('reminders','Påminnelser','Lägg till en enkel påminnelse.',`<div class="list">${r.map((x,i)=>`<div class="card"><b>🔔 ${esc(x.text)}</b><p>${esc(x.date)}</p><button class="btn secondary" onclick="doneReminder(${i})">${x.done?'Klar':'Markera klar'}</button></div>`).join('')||'<div class="card">Inga påminnelser ännu.</div>'}</div><div class="card" style="margin-top:12px"><div class="field"><label>Text</label><input id="rt" placeholder="Följ upp läggningen"></div><div class="field"><label>Datum</label><input id="rd" type="date"></div><button class="btn" onclick="addReminder()">Spara</button></div>`)}
function addReminder(){const t=$('rt').value.trim(),d=$('rd').value;if(!t||!d){alert('Fyll i text och datum.');return}const r=storage('vc_reminders',[]);r.unshift({text:t,date:d,done:false});put('vc_reminders',r);render()}
function doneReminder(i){const r=storage('vc_reminders',[]);r[i].done=true;put('vc_reminders',r);render()}
function supportPage(){return simplePage('support','❤️ Stöd','Du behöver inte lösa allt själv.',`<div class="grid"><button class="tile" onclick="alert('Börja gärna med familjestöd, vårdcentral eller annan professionell hjälp beroende på situationen.')"><strong>💬 Jag behöver prata med någon</strong><small>Få hjälp att hitta ett nästa steg.</small></button><button class="tile" onclick="alert('Vid oro för barnets mående kan skola, elevhälsa eller vård vara en väg beroende på situationen.')"><strong>👶 Jag är orolig för barnet</strong><small>Ta oron på allvar och sök stöd vid behov.</small></button></div>`)}
function wordsPage(){const w=[['😤','När barnet är argt','Jag ser att du är arg. Jag lyssnar när du är redo. Vi behöver fortfarande hålla den här gränsen.'],['📱','När skärmen ska stängas','Jag vet att du vill fortsätta. Det är svårt att sluta när man har roligt. Nu är tiden slut.'],['🛏️','När barnet inte vill sova','Jag hör att du inte vill gå och lägga dig. Nu börjar vår kvällsrutin och jag hjälper dig.'],['💬','När barnet inte vill prata','Du behöver inte berätta allt nu. Jag finns här när du vill prata.'],['🏫','När barnet inte vill gå till skolan','Jag hör att det känns jobbigt. Vi behöver försöka förstå vad som gör det svårt.']];return simplePage('words','💬 Säg så här','Enkla meningar när det är svårt att hitta orden.',`<div class="list">${w.map(x=>`<div class="card"><h3>${x[0]} ${x[1]}</h3><p>”${x[2]}”</p></div>`).join('')}</div>`)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function updateCounts(){$('saved').textContent=storage('vc_history',[]).length;$('followCount').textContent=storage('vc_follow',[]).length;$('notes').textContent=storage('vc_history',[]).length;$('reminderCount').textContent=storage('vc_reminders',[]).length}
function boot(){nav();$('main').innerHTML=home()+areasPage()+`<section id="detailPage" class="page"></section>`+`<section id="situationPage" class="page"></section>`+chatPage()+historyPage()+followPage()+situationsPage()+childrenPage()+patternsPage()+remindersPage()+supportPage()+wordsPage();detail();renderSituations('homeSituations');renderSituations('allSituations');updateCounts();document.querySelector('#nav button').classList.add('active');const ci=$('chatInput');if(ci)ci.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}});}
boot();
</script>
</body>
</html>
